# Rehearses a release on TestPyPI. The package is built and checked as for a release, uploaded to TestPyPI, downloaded
# again and compared byte for byte with the built wheel, then installed into fresh environments that run the smoke test.
# TestPyPI keeps every version once, so a repeat rehearsal needs a new version in pyproject.toml. The pinned dependencies
# `plurai-mockenv` and `plurai-extract` must be served by TestPyPI or PyPI first; the repository variable DEPENDENCY_INDEX_URL
# can name the TestPyPI simple index for the run.
#
# TestPyPI has its own trusted publisher for this repository: workflow `testpypi-rehearsal.yml`, environment `testpypi`.
name: testpypi-rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'plurai-ai/plurai-simulation-sdk'
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    if: github.repository == 'plurai-ai/plurai-simulation-sdk'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify:
    needs: [package, publish]
    if: github.repository == 'plurai-ai/plurai-simulation-sdk'
    uses: ./.github/workflows/smoke.yml
    with:
      source: testpypi
