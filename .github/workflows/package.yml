# Builds the wheel and the sdist from the exported tree, checks what they contain, and installs the built wheel into a
# fresh environment on every supported Python. publish.yml calls this workflow and publishes the files it uploads as the
# `dist` artifact.
#
# The workflow is part of the release export. It runs in the public mirror only: in the private development repository
# every job is skipped, because the dependencies resolve there through a private index.
name: package

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'plurai-ai/plurai-simulation-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"

      - name: Resolve the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$REF_TYPE" = tag ] && [ "v${version}" != "$REF_NAME" ]; then
            echo "Tag ${REF_NAME} does not match pyproject.toml version v${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: uv build

      - name: Check the built files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*-"${VERSION}"-*.whl)
          sdists=(dist/*-"${VERSION}".tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ] || [ "$(find dist -type f ! -name .gitignore | wc -l)" -ne 2 ]; then
            echo "Expected one wheel and one sdist for ${VERSION}, found:" >&2
            ls dist >&2
            exit 1
          fi
          python3 .github/scripts/check_dist.py content dist --package plurai

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml
    with:
      source: dist
